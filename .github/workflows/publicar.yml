name: Publicar packs e gerar o EXE

# Roda sozinho quando voce mexer em qualquer pack (mods, noticias, pack.json)
# ou no codigo do launcher.
# Tambem pode ser rodado na mao pelo botao "Run workflow".
on:
  push:
    # So no main. Sem isso, subir uma branch de teste ja publicaria um Release
    # e escreveria os manifests no main.
    branches:
      - main
    paths:
      - ".github/workflows/**"
      - "packs/**"
      - "launcher.json"
      - "broxas_updater.py"
      - "interface.py"
      - "detector.py"
      - "forge_setup.py"
      - "launchers.py"
      - "preparar_jogo.py"
      - "gerar_packs.py"
      - "verificar_manifest.py"
      - "rede.py"
  workflow_dispatch:

permissions:
  contents: write

# Evita que duas execucoes tentem salvar os manifests ao mesmo tempo.
concurrency:
  group: publicar-packs
  cancel-in-progress: false

jobs:
  # ------------------------------------------------------------------
  # 1) Gera o manifest.json de CADA pack em packs/ e o packs.json
  # ------------------------------------------------------------------
  packs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Definir a versao
        id: info
        run: |
          VERSAO="2.0.${{ github.run_number }}"
          echo "versao=$VERSAO" >> $GITHUB_OUTPUT
          echo "Versao dos packs: $VERSAO"

      # Confere a estrutura antes de gerar qualquer coisa, para a mensagem de
      # erro ser clara em vez de um traceback do Python.
      - name: Conferir a estrutura das pastas
        run: |
          if [ ! -d packs ]; then
            echo "::error::A pasta 'packs' nao existe."
            exit 1
          fi

          encontrados=0
          for pasta in packs/*/; do
            [ -d "$pasta" ] || continue
            id=$(basename "$pasta")

            if [ ! -f "$pasta/pack.json" ]; then
              echo "::error::Falta o arquivo packs/$id/pack.json"
              exit 1
            fi

            qtd=$(ls "$pasta"mods/*.jar 2>/dev/null | wc -l)
            externos=0
            if [ -f "$pasta/mods_externos.json" ]; then
              externos=$(python -c "import json;print(len(json.load(open('$pasta/mods_externos.json')).get('mods',[])))")
            fi

            if [ "$qtd" -eq 0 ] && [ "$externos" -eq 0 ]; then
              echo "::error::O pack '$id' nao tem nenhum mod (nem na pasta, nem por link)."
              exit 1
            fi

            echo "  $id: $qtd mod(s) na pasta + $externos por link"
            encontrados=$((encontrados + 1))
          done

          if [ "$encontrados" -eq 0 ]; then
            echo "::error::Nenhum pack encontrado dentro de packs/"
            exit 1
          fi
          echo "$encontrados pack(s) encontrado(s)."

      - name: Gerar os manifests e o packs.json
        run: |
          python gerar_packs.py \
            --repo "${{ github.repository }}" \
            --versao "${{ steps.info.outputs.versao }}"

      # Confere se todos os mods de TODOS os packs podem ser baixados ANTES de
      # publicar. Se algo quebrou, nada e salvo e a galera continua com a
      # versao anterior, que funciona.
      - name: Instalar certifi
        run: python -m pip install --upgrade certifi

      - name: Conferir se todos os mods podem ser baixados
        env:
          # Arquivo recem-enviado leva um tempinho para aparecer no
          # raw.githubusercontent.com. Sem paciencia aqui, o robo falha por
          # engano quando voce sobe um mod novo.
          VERIFICAR_TENTATIVAS: "8"
          VERIFICAR_ESPERA: "20"
        run: |
          falhou=0
          for manifest in packs/*/manifest.json; do
            id=$(basename "$(dirname "$manifest")")
            echo "::group::Conferindo o pack '$id'"
            if ! python verificar_manifest.py "$manifest"; then
              echo "::error::O pack '$id' tem mods que nao podem ser baixados."
              falhou=1
            fi
            echo "::endgroup::"
          done
          exit $falhou

      # Salva com nova tentativa: se alguem publicar algo no meio do caminho,
      # a execucao pega as mudancas novas e tenta de novo em vez de falhar.
      - name: Salvar os manifests no repositorio
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          mkdir -p "$RUNNER_TEMP/gerados"
          cp packs.json "$RUNNER_TEMP/gerados/packs.json"
          cp LISTA_DE_MODS.md "$RUNNER_TEMP/gerados/LISTA_DE_MODS.md"
          for manifest in packs/*/manifest.json; do
            id=$(basename "$(dirname "$manifest")")
            cp "$manifest" "$RUNNER_TEMP/gerados/$id.manifest.json"
          done

          for tentativa in 1 2 3 4 5; do
            git fetch origin main
            git checkout -B main origin/main

            cp "$RUNNER_TEMP/gerados/packs.json" packs.json
            cp "$RUNNER_TEMP/gerados/LISTA_DE_MODS.md" LISTA_DE_MODS.md
            git add packs.json LISTA_DE_MODS.md
            for arquivo in "$RUNNER_TEMP/gerados/"*.manifest.json; do
              id=$(basename "$arquivo" .manifest.json)
              if [ -d "packs/$id" ]; then
                cp "$arquivo" "packs/$id/manifest.json"
                git add "packs/$id/manifest.json"
              fi
            done

            if git diff --staged --quiet; then
              echo "As listas ja estao atualizadas, nada para salvar."
              exit 0
            fi

            git commit -m "Atualiza as listas dos packs (v${{ steps.info.outputs.versao }})" \
                       -m "Gerado por gerar_packs.py"

            if git push origin HEAD:main; then
              echo "Listas salvas com sucesso."
              exit 0
            fi

            echo "A branch main mudou durante a execucao. Tentativa $tentativa de 5..."
            sleep 5
          done

          echo "::error::Nao consegui salvar as listas depois de 5 tentativas."
          exit 1

  # ------------------------------------------------------------------
  # 2) Compila o .exe no Windows e publica em Releases
  #    Roda em paralelo: nao depende do job de cima, porque o app so
  #    guarda o ENDERECO do packs.json, nao o conteudo dele.
  # ------------------------------------------------------------------
  exe:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar PyInstaller
        run: python -m pip install --upgrade pip pyinstaller certifi

      # Gera um arquivo de configuracao em vez de editar o codigo com regex.
      # A tentativa anterior com regex falhava em silencio no Windows, porque
      # o checkout converte as linhas para CRLF e o ancora $ nao casava.
      - name: Gerar configuracao do app
        shell: pwsh
        run: |
          $cfg = Get-Content launcher.json -Raw | ConvertFrom-Json
          $packsUrl = "https://raw.githubusercontent.com/${{ github.repository }}/main/packs.json"
          $linhas = @(
            '# Arquivo gerado automaticamente pelo GitHub Actions. Nao edite.',
            ('PACKS_URL = "' + $packsUrl + '"'),
            'MANIFEST_URL = ""',
            ('SERVER_NAME = "' + $cfg.server_name + '"'),
            ('SERVER_IP = "' + $cfg.server_ip + '"')
          )
          Set-Content -Path "configuracao.py" -Value $linhas -Encoding utf8
          Write-Host "--- configuracao.py ---"
          Get-Content configuracao.py

      # Trava de seguranca: se a configuracao nao tiver sido aplicada, o build
      # para aqui em vez de publicar um executavel que da 404 no jogador.
      - name: Conferir a configuracao
        shell: pwsh
        run: |
          python -c "import configuracao as c; assert 'SEU_USUARIO' not in c.PACKS_URL, 'a URL do packs.json nao foi configurada'; assert c.PACKS_URL.startswith('https://'), 'URL invalida'; print('URL dos packs:', c.PACKS_URL)"
          python -c "import broxas_updater as a; assert 'SEU_USUARIO' not in a.PACKS_URL, 'o app nao carregou a configuracao'; print('O app vai usar:', a.PACKS_URL); print('Servidor:', a.SERVER_NAME, '-', a.SERVER_IP)"

      - name: Compilar o executavel
        shell: pwsh
        run: |
          $nome = (Get-Content launcher.json -Raw | ConvertFrom-Json).server_name
          $opcoes = @("--onefile","--noconsole","--clean","--name","$nome-Updater",
                      "--hidden-import","configuracao",
                      "--hidden-import","interface",
                      "--hidden-import","launchers",
                      "--hidden-import","detector",
                      "--hidden-import","forge_setup",
                      "--hidden-import","preparar_jogo",
                      "--hidden-import","rede",
                      "--hidden-import","certifi",
                      "--collect-data","certifi")
          if (Test-Path "icone.ico") { $opcoes += @("--icon","icone.ico") }
          python -m PyInstaller @opcoes broxas_updater.py
          Get-ChildItem dist

      - name: Guardar o exe como artefato
        uses: actions/upload-artifact@v4
        with:
          name: updater-exe
          path: dist/*.exe

      - name: Publicar em Releases (link fixo para a galera)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: updater
          name: BroxasSMP Updater
          body: |
            Baixe o arquivo .exe abaixo, abra e escolha o modpack que quer jogar.

            Modpacks: Guerra Medieval e Magia e Tecnologia
            Versao: 2.0.${{ github.run_number }}
            Publicado automaticamente.
          files: dist/*.exe
          fail_on_unmatched_files: true
