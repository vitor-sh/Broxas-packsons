name: Publicar pack e gerar o EXE

# Roda sozinho quando voce mexer nos mods, nas noticias ou no pack.json.
# Tambem pode ser rodado na mao pelo botao "Run workflow".
on:
  push:
    paths:
      - "mods/**"
      - "noticias.txt"
      - "pack.json"
      - "mods_externos.json"
      - "broxas_updater.py"
      - "detector.py"
      - "forge_setup.py"
      - "gerar_manifest.py"
  workflow_dispatch:

permissions:
  contents: write

# Evita que duas execucoes tentem salvar o manifest ao mesmo tempo.
concurrency:
  group: publicar-pack
  cancel-in-progress: false

jobs:
  # ------------------------------------------------------------------
  # 1) Gera o manifest.json a partir da pasta mods/ e do noticias.txt
  # ------------------------------------------------------------------
  manifest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Ler configuracoes do pack.json
        id: info
        run: |
          MC=$(python -c "import json;print(json.load(open('pack.json'))['minecraft'])")
          FORGE=$(python -c "import json;print(json.load(open('pack.json'))['forge'])")
          VERSAO="1.0.${{ github.run_number }}"
          echo "mc=$MC" >> $GITHUB_OUTPUT
          echo "forge=$FORGE" >> $GITHUB_OUTPUT
          echo "versao=$VERSAO" >> $GITHUB_OUTPUT
          echo "Minecraft $MC | Forge $FORGE | pack v$VERSAO"

      - name: Conferir se a pasta mods existe
        run: |
          if [ ! -d mods ] || [ -z "$(ls -A mods/*.jar 2>/dev/null)" ]; then
            echo "::error::A pasta 'mods' esta vazia. Suba os arquivos .jar dentro dela."
            exit 1
          fi
          echo "Encontrados $(ls mods/*.jar | wc -l) mods na pasta."

      - name: Gerar manifest.json
        run: |
          python gerar_manifest.py \
            --mods "mods" \
            --base-url "https://raw.githubusercontent.com/${{ github.repository }}/main/mods" \
            --versao "${{ steps.info.outputs.versao }}" \
            --minecraft "${{ steps.info.outputs.mc }}" \
            --forge "${{ steps.info.outputs.forge }}" \
            --noticias "noticias.txt" \
            --externos "mods_externos.json" \
            --saida "manifest.json"

      # Salva com nova tentativa: se alguem publicar algo no meio do caminho,
      # a execucao pega as mudancas novas e tenta de novo em vez de falhar.
      - name: Salvar manifest.json no repositorio
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          cp manifest.json "$RUNNER_TEMP/manifest.json"

          for tentativa in 1 2 3 4 5; do
            git fetch origin main
            git checkout -B main origin/main
            cp "$RUNNER_TEMP/manifest.json" manifest.json
            git add manifest.json

            if git diff --staged --quiet; then
              echo "O manifest ja esta atualizado, nada para salvar."
              exit 0
            fi

            git commit -m "Atualiza manifest (pack v${{ steps.info.outputs.versao }})"

            if git push origin HEAD:main; then
              echo "manifest.json salvo com sucesso."
              exit 0
            fi

            echo "A branch main mudou durante a execucao. Tentativa $tentativa de 5..."
            sleep 5
          done

          echo "::error::Nao consegui salvar o manifest.json depois de 5 tentativas."
          exit 1

  # ------------------------------------------------------------------
  # 2) Compila o .exe no Windows e publica em Releases
  #    Roda em paralelo: nao depende do manifest, porque o app so
  #    guarda o ENDERECO do manifest, nao o conteudo dele.
  # ------------------------------------------------------------------
  exe:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar PyInstaller
        run: python -m pip install --upgrade pip pyinstaller

      - name: Configurar o app (URL, nome e IP automaticamente)
        shell: pwsh
        run: |
          $cfg = Get-Content pack.json -Raw | ConvertFrom-Json
          $manifestUrl = "https://raw.githubusercontent.com/${{ github.repository }}/main/manifest.json"
          $f = "broxas_updater.py"
          $t = Get-Content $f -Raw
          $t = $t -replace '(?m)^MANIFEST_URL = ".*"$', ('MANIFEST_URL = "' + $manifestUrl + '"')
          $t = $t -replace '(?m)^SERVER_NAME = ".*"$',  ('SERVER_NAME = "' + $cfg.server_name + '"')
          $t = $t -replace '(?m)^SERVER_IP = ".*"$',    ('SERVER_IP = "' + $cfg.server_ip + '"')
          Set-Content $f $t -NoNewline
          Select-String -Path $f -Pattern '^MANIFEST_URL|^SERVER_NAME|^SERVER_IP'

      - name: Compilar o executavel
        shell: pwsh
        run: |
          $nome = (Get-Content pack.json -Raw | ConvertFrom-Json).server_name
          $opcoes = @("--onefile","--noconsole","--clean","--name","$nome-Updater")
          if (Test-Path "icone.ico") { $opcoes += @("--icon","icone.ico") }
          python -m PyInstaller @opcoes broxas_updater.py
          Get-ChildItem dist

      - name: Guardar o exe como artefato
        uses: actions/upload-artifact@v4
        with:
          name: updater-exe
          path: dist/*.exe

      - name: Publicar em Releases (link fixo para a galera)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: updater
          name: BroxasSMP Updater
          body: |
            Baixe o arquivo .exe abaixo, abra e clique no botao.

            Pack: v1.0.${{ github.run_number }}
            Publicado automaticamente.
          files: dist/*.exe
          fail_on_unmatched_files: true
